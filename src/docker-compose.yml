# The Compose project name is pinned so the deploy directory can be moved
# without renaming or recreating the running containers (src-*).
name: src

services:
  # Reverse Proxy
  caddy:
    image: caddy:2.7-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ${DATA_ROOT}/caddy/data:/data
      - ${DATA_ROOT}/caddy/config:/config
    depends_on:
      - codimd
      - n8n
      - outline
    environment:
      - ACME_EMAIL=${ACME_EMAIL}
      - CADDY_TLS=${CADDY_TLS}
      - CODIMD_DOMAIN=${CODIMD_DOMAIN}
      - N8N_DOMAIN=${N8N_DOMAIN}
      - OUTLINE_DOMAIN=${OUTLINE_DOMAIN}
    networks:
      - web

  # CodiMD Services
  codimd-db:
    image: postgres:11.6-alpine
    restart: always
    environment:
      - POSTGRES_USER=${CODIMD_DB_USER}
      - POSTGRES_PASSWORD=${CODIMD_DB_PASSWORD}
      - POSTGRES_DB=${CODIMD_DB_NAME}
    volumes:
      - ${DATA_ROOT}/codimd/db:/var/lib/postgresql/data
    networks:
      - backend

  codimd:
    image: hackmdio/hackmd:2.6.1
    restart: always
    environment:
      - CMD_DB_URL=postgres://${CODIMD_DB_USER}:${CODIMD_DB_PASSWORD}@codimd-db/${CODIMD_DB_NAME}
      - CMD_USECDN=false
      - CMD_DOMAIN=${CODIMD_DOMAIN}
      - CMD_PROTOCOL_USESSL=true
      - CMD_ALLOW_ANONYMOUS=false
      - CMD_EMAIL=false
      - CMD_ALLOW_EMAIL_REGISTER=false
      # OAuth2 - Entra ID
      - CMD_OAUTH2_PROVIDERNAME=${CODIMD_OAUTH2_PROVIDERNAME}
      - CMD_OAUTH2_SCOPE=${CODIMD_OAUTH2_SCOPE}
      - CMD_OAUTH2_CLIENT_ID=${CODIMD_OAUTH2_CLIENT_ID}
      - CMD_OAUTH2_CLIENT_SECRET=${CODIMD_OAUTH2_CLIENT_SECRET}
      - CMD_OAUTH2_AUTHORIZATION_URL=${CODIMD_OAUTH2_AUTHORIZATION_URL}
      - CMD_OAUTH2_TOKEN_URL=${CODIMD_OAUTH2_TOKEN_URL}
      - CMD_OAUTH2_USER_PROFILE_URL=${CODIMD_OAUTH2_USER_PROFILE_URL}
      - CMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR=${CODIMD_OAUTH2_USER_PROFILE_DISPLAY_NAME_ATTR}
      - CMD_OAUTH2_USER_PROFILE_USERNAME_ATTR=${CODIMD_OAUTH2_USER_PROFILE_USERNAME_ATTR}
      - CMD_OAUTH2_USER_PROFILE_EMAIL_ATTR=${CODIMD_OAUTH2_USER_PROFILE_EMAIL_ATTR}
      # Azure Storage
      - CMD_IMAGE_UPLOAD_TYPE=azure
      - CMD_AZURE_CONNECTION_STRING=${CODIMD_AZURE_CONNECTION_STRING}
      - CMD_AZURE_CONTAINER=${CODIMD_AZURE_CONTAINER}
    depends_on:
      - codimd-db
    volumes:
      - ${DATA_ROOT}/codimd/uploads:/home/hackmd/app/public/uploads
    networks:
      - web
      - backend

  # n8n Services
  n8n-db:
    image: postgres:14-alpine
    restart: always
    environment:
      - POSTGRES_USER=${N8N_DB_USER}
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
      - POSTGRES_DB=${N8N_DB_NAME}
    volumes:
      - ${DATA_ROOT}/n8n/db:/var/lib/postgresql/data
    networks:
      - backend

  n8n:
    image: n8nio/n8n:2.32.5
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME}
      - DB_POSTGRESDB_USER=${N8N_DB_USER}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_HOST=${N8N_DOMAIN}
      - WEBHOOK_URL=https://${N8N_DOMAIN}
      - NODE_ENV=production
      - N8N_PROTOCOL=https
      - N8N_PORT=5678
      - GENERIC_TIMEZONE=UTC
      # Secrets from original config
      - THREADS_ACCESS_TOKEN=${N8N_THREADS_ACCESS_TOKEN}
      - EXCHANGE_API_KEY=${N8N_EXCHANGE_API_KEY}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      # n8n emits large auth headers; the default 16 KB limit truncates them.
      # Must be kept in sync with Caddy's max_header_size.
      - NODE_OPTIONS=--max-http-header-size=32768
    volumes:
      - ${DATA_ROOT}/n8n/data:/home/node/.n8n
    depends_on:
      - n8n-db
    networks:
      - web
      - backend

  # Outline Services
  # PostgreSQL 17 rather than 18: 18 relocates PGDATA and changes the volume
  # layout, whereas 17 keeps /var/lib/postgresql/data consistent with the two
  # databases above. Supported until 2029.
  outline-db:
    image: postgres:17-alpine
    restart: always
    environment:
      - POSTGRES_USER=${OUTLINE_DB_USER}
      - POSTGRES_PASSWORD=${OUTLINE_DB_PASSWORD}
      - POSTGRES_DB=${OUTLINE_DB_NAME}
    volumes:
      - ${DATA_ROOT}/outline/db:/var/lib/postgresql/data
    # This host has 2 vCPU / 3.8 GiB and no spare headroom; cap each service so
    # one cannot starve the others.
    mem_limit: 256m
    networks:
      - backend

  outline-redis:
    image: redis:8-alpine
    restart: always
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - ${DATA_ROOT}/outline/redis:/data
    mem_limit: 128m
    networks:
      - backend

  outline:
    image: docker.getoutline.com/outlinewiki/outline:1.10.0
    restart: always
    environment:
      - NODE_ENV=production
      - URL=https://${OUTLINE_DOMAIN}
      - PORT=3000
      # Names the workspace. The OIDC sign-in path derives the team name from
      # this rather than from a directory lookup.
      - APP_NAME=${OUTLINE_APP_NAME}
      - SECRET_KEY=${OUTLINE_SECRET_KEY}
      - UTILS_SECRET=${OUTLINE_UTILS_SECRET}
      # Database supplied as discrete components rather than a connection URL,
      # so the password is never embedded in a URL string.
      - DATABASE_HOST=outline-db
      - DATABASE_PORT=5432
      - DATABASE_NAME=${OUTLINE_DB_NAME}
      - DATABASE_USER=${OUTLINE_DB_USER}
      - DATABASE_PASSWORD=${OUTLINE_DB_PASSWORD}
      # App and database share a private network, so TLS between them is noise.
      - PGSSLMODE=disable
      - REDIS_URL=redis://outline-redis:6379
      # Attachments on local disk. Outline supports only "local" or "s3";
      # Azure Blob is not an option.
      - FILE_STORAGE=local
      - FILE_STORAGE_LOCAL_ROOT_DIR=/var/lib/outline/data
      # OIDC via the existing Entra app registration. The Azure plugin is
      # deliberately not used: it calls Graph /v1.0/organization and fails hard
      # without Organization.Read.All, which that app does not have.
      - OIDC_CLIENT_ID=${OUTLINE_OIDC_CLIENT_ID}
      - OIDC_CLIENT_SECRET=${OUTLINE_OIDC_CLIENT_SECRET}
      - OIDC_AUTH_URI=${OUTLINE_OIDC_AUTH_URI}
      - OIDC_TOKEN_URI=${OUTLINE_OIDC_TOKEN_URI}
      - OIDC_USERINFO_URI=${OUTLINE_OIDC_USERINFO_URI}
      - OIDC_USERNAME_CLAIM=${OUTLINE_OIDC_USERNAME_CLAIM:-preferred_username}
      - OIDC_DISPLAY_NAME=${OUTLINE_OIDC_DISPLAY_NAME:-Entra ID}
      - OIDC_SCOPES=${OUTLINE_OIDC_SCOPES:-openid profile email}
      # Caddy terminates TLS and Cloudflare sits in front of it.
      - FORCE_HTTPS=false
      - PROXY_HEADERS_TRUSTED=true
      - PROXY_IP_HEADER=CF-Connecting-IP
      # Single worker: official guidance is available memory / 512.
      - WEB_CONCURRENCY=1
      - NODE_OPTIONS=--max-old-space-size=768
      - RATE_LIMITER_ENABLED=true
      - LOG_LEVEL=info
    volumes:
      - ${DATA_ROOT}/outline/data:/var/lib/outline/data
    mem_limit: 1g
    depends_on:
      - outline-db
      - outline-redis
    networks:
      - web
      - backend

  # RustDesk Self-Hosted Server
  rustdesk-hbbs:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbs
    command: hbbs -r ${RUSTDESK_DOMAIN}:21117
    restart: unless-stopped
    network_mode: "host"
    depends_on:
      - rustdesk-hbbr
    volumes:
      - ${DATA_ROOT}/rustdesk/data:/root
    environment:
      - ENCRYPTED_ONLY=${RUSTDESK_ENCRYPTED_ONLY:-1}

  rustdesk-hbbr:
    image: rustdesk/rustdesk-server:latest
    container_name: rustdesk-hbbr
    command: hbbr
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - ${DATA_ROOT}/rustdesk/data:/root

networks:
  web:
  backend:
